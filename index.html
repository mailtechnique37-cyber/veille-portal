    document.getElementById('pin-btn').textContent = isPinned ? '★ Désépingler' : '☆ Épingler';
    document.getElementById('later-btn').textContent = isLater ? '⏱ Retirer' : '⏱ Plus tard';
    document.getElementById('reader-actions').innerHTML =
      (art.link ? `<a class="btn-primary" href="${this.escape(art.link)}" target="_blank" rel="noopener" style="text-decoration:none">Lire l'article →</a>` : '') +
      `<button class="btn-ghost" onclick="S.shareArticle()">Copier le lien</button>` +
      (IS_PUBLIC ? '' : `<button class="btn-ghost" onclick="S.tagCurrentArticle()">Taguer</button>`);
    this.renderReaderAnnotation();
    document.getElementById('reader').classList.add('on');
    this.renderTabs();
    this.renderCanvas();
    this.saveState();
  },

  renderReaderAnnotation() {
    const el = document.getElementById('reader-annotation');
    if (!el || !this.curArt || IS_PUBLIC) { if (el) el.innerHTML = ''; return; }
    const id = this.curArt.id;
    const entry = this.state.library[id];
    const note = entry ? entry.note || '' : '';
    const tags = entry ? entry.tags || [] : [];
    el.innerHTML = `
      <div class="reader-note">
        <div class="reader-note-label">Note personnelle</div>
        <textarea id="art-note" placeholder="Ajoute une note libre à cet article…" oninput="S.updateNote()">${this.escape(note)}</textarea>
      </div>
      ${tags.length ? `<div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:4px">${tags.map(t => `<span class="tag-chip">#${this.escape(t)}<span class="rm" onclick="S.removeTag('${this.escape(t)}')">×</span></span>`).join('')}</div>` : ''}
    `;
  },

  updateNote() {
    if (!this.curArt) return;
    const id = this.curArt.id;
    const note = document.getElementById('art-note').value;
    // Archiver si nécessaire
    if (note.trim() && !this.state.library[id]) this.archiveArticle(id);
    if (this.state.library[id]) {
      this.state.library[id].note = note;
      this.saveState();
    }
  },

  tagCurrentArticle() {
    if (!this.curArt) return;
    this.openBatchTagModal([this.curArt.id]);
  },

  removeTag(t) {
    if (!this.curArt) return;
    const id = this.curArt.id;
    const entry = this.state.library[id];
    if (entry && entry.tags) {
      entry.tags = entry.tags.filter(x => x !== t);
      this.renderReaderAnnotation();
      this.saveState();
    }
  },

  closeReader() { document.getElementById('reader').classList.remove('on'); },

  pinCurrentArticle() {
    if (!this.curArt) return;
    const id = this.curArt.id;
    if (this.state.saved.includes(id)) {
      this.state.saved = this.state.saved.filter(x => x !== id);
      this.toast('Désépinglé');
    } else {
      this.state.saved.push(id);
      this.archiveArticle(id);
      this.toast('Article épinglé');
    }
    document.getElementById('pin-btn').textContent = this.state.saved.includes(id) ? '★ Désépingler' : '☆ Épingler';
    this.renderCanvas();
    this.saveState();
  },

  laterCurrentArticle() {
    if (!this.curArt) return;
    const id = this.curArt.id;
    if (this.state.later.includes(id)) {
      this.state.later = this.state.later.filter(x => x !== id);
      this.toast('Retiré de "À lire plus tard"');
    } else {
      this.state.later.push(id);
      this.archiveArticle(id);
      this.toast('Ajouté à "À lire plus tard"');
    }
    document.getElementById('later-btn').textContent = this.state.later.includes(id) ? '⏱ Retirer' : '⏱ Plus tard';
    this.renderCanvas();
    this.saveState();
  },

  shareArticle() {
    if (!this.curArt || !this.curArt.link) return;
    navigator.clipboard.writeText(this.curArt.link)
      .then(() => this.toast('Lien copié'))
      .catch(() => this.toast('Copie impossible'));
  },

  // ===================================================================
  //  DRAG & DROP
  // ===================================================================

  dropOnCol(colId) {
    if (!this.dragWidget) return;
    const srcTab = this.dragFromTab || this.state.activeTab;
    const srcCols = this.state.columns[srcTab] || [];
    const sc = srcCols.find(c => c.id === this.dragFromCol);
    if (sc) sc.widgets = sc.widgets.filter(w => w !== this.dragWidget);
    const destCols = this.state.columns[this.state.activeTab] || [];
    const dc = destCols.find(c => c.id === colId);
    if (dc && !dc.widgets.includes(this.dragWidget)) dc.widgets.push(this.dragWidget);
    this.dragWidget = this.dragFromCol = this.dragFromTab = null;
    this.render();
    this.saveState();
    this.toast('Widget déplacé');
  },

  tabDragStart(e, tid) {
    const tab = this.state.tabs.find(t => t.id === tid);
    if (!tab || tab.pinned) { e.preventDefault(); return; }
    this.dragTabId = tid;
    e.dataTransfer.effectAllowed = 'move';
    e.stopPropagation();
  },

  tabDragEnd() {
    this.dragTabId = null;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('reorder-drop-before', 'reorder-drop-after', 'drag-over'));
  },

  tabDragOver(e, tid) {
    e.preventDefault();
    if (this.dragTabId) {
      const el = document.querySelector(`.tab[data-tid="${tid}"]`);
      if (!el) return;
      const rect = el.getBoundingClientRect();
      const before = e.clientX < rect.left + rect.width / 2;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('reorder-drop-before', 'reorder-drop-after'));
      el.classList.add(before ? 'reorder-drop-before' : 'reorder-drop-after');
      return;
    }
    if (this.dragWidget) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('drag-over'));
      const el = document.querySelector(`.tab[data-tid="${tid}"]`);
      if (el) el.classList.add('drag-over');
    }
  },

  tabDragLeave(tid) {
    const el = document.querySelector(`.tab[data-tid="${tid}"]`);
    if (el) el.classList.remove('drag-over', 'reorder-drop-before', 'reorder-drop-after');
  },

  tabDrop(e, tid) {
    e.preventDefault();
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('drag-over', 'reorder-drop-before', 'reorder-drop-after'));
    if (this.dragTabId && this.dragTabId !== tid) {
      const targetEl = document.querySelector(`.tab[data-tid="${tid}"]`);
      const before = targetEl ? e.clientX < targetEl.getBoundingClientRect().left + targetEl.getBoundingClientRect().width / 2 : false;
      this.reorderTab(this.dragTabId, tid, before);
      this.dragTabId = null;
      return;
    }
    if (!this.dragWidget || tid === this.dragFromTab) return;
    const srcCols = this.state.columns[this.dragFromTab] || [];
    const sc = srcCols.find(c => c.id === this.dragFromCol);
    if (sc) sc.widgets = sc.widgets.filter(w => w !== this.dragWidget);
    const destCols = this.state.columns[tid] || [];
    if (!destCols.length) destCols.push({ id: mkId(), widgets: [] });
    destCols[0].widgets.push(this.dragWidget);
    this.dragWidget = this.dragFromCol = this.dragFromTab = null;
    this.render();
    this.saveState();
    this.toast('Widget déplacé vers l\'onglet');
  },

  reorderTab(srcId, destId, before) {
    const srcTab = this.state.tabs.find(t => t.id === srcId);
    const destTab = this.state.tabs.find(t => t.id === destId);
    if (!srcTab || !destTab || srcTab.pinned) return;
    if (destTab.pinned && before) return;
    this.state.tabs = this.state.tabs.filter(t => t.id !== srcId);
    const destIdx = this.state.tabs.findIndex(t => t.id === destId);
    this.state.tabs.splice(before ? destIdx : destIdx + 1, 0, srcTab);
    this.render();
    this.saveState();
  },

  toggleTabPin(tid) {
    const tab = this.state.tabs.find(t => t.id === tid);
    if (!tab) return;
    tab.pinned = !tab.pinned;
    this.closeCtx();
    this.render();
    this.saveState();
    this.toast(tab.pinned ? 'Onglet épinglé' : 'Onglet désépinglé');
  },

      <div class="ctx-item" onclick="S.markWidgetAllRead('${wid}')">✓ Tout marquer lu</div>
      <div class="ctx-item" onclick="S.editWidget('${wid}')">✎ Modifier…</div>
      <div class="ctx-item" onclick="S.moveWidgetToTab('${wid}','${colId}')">→ Déplacer vers…</div>
      <div class="ctx-sep"></div>

  openTabMenu(tid, e) {
    e.stopPropagation();

    const ctx = document.getElementById('ctx-menu');

    ctx.style.top = (e.clientY + 8) + 'px';

      <div class="ctx-item" onclick="S.toggleTabPin('${tid}')">${tab.pinned ? '☆ Désépingler' : '★ Épingler'}</div>
      <div class="ctx-item" onclick="S.renameTab('${tid}')">✎ Renommer…</div>
      <div class="ctx-item" onclick="S.recolorTab('${tid}')">🎨 Couleur…</div>
      <div class="ctx-item" onclick="S.duplicateTab('${tid}')">⧉ Dupliquer</div>
      <div class="ctx-sep"></div>
      <div class="ctx-item danger" onclick="S.deleteTab('${tid}')">🗑 Supprimer</div>`;
  },

  closeCtx() { document.getElementById('ctx-menu').style.display = 'none'; },

  markWidgetAllRead(wid) {
    const w = this.state.widgets[wid];
    if (w && w.items) w.items.forEach(i => {
      i.unread = false;
      if (!this.state.readIds.includes(i.id)) this.state.readIds.push(i.id);
    });
    this.closeCtx();
    this.render();
    this.saveState();
    this.toast('Tous marqués lus');
  },

  editWidget(wid) {
    this.closeCtx();
    const w = this.state.widgets[wid];
    if (!w) return;
    document.getElementById('modal-body').innerHTML = `
      <h3>Modifier le widget</h3>
      <div class="form-row"><label>Titre</label><input id="ew-title" type="text" value="${this.escape(w.title)}"></div>
      <div class="form-row"><label>URL du flux</label><input id="ew-url" type="url" value="${this.escape(w.url || '')}"></div>

        <button class="btn-primary" onclick="S.doEditWidget('${wid}')">Enregistrer</button>

  doEditWidget(wid) {

    if (!w) return;
    w.title = document.getElementById('ew-title').value.trim() || w.title;
    const newUrl = document.getElementById('ew-url').value.trim();
    const urlChanged = newUrl !== w.url;
    w.url = newUrl;
    this.closeModal();
    this.render();

  },

  moveWidgetToTab(wid, colId) {
    this.closeCtx();
    document.getElementById('modal-body').innerHTML = `
      <h3>Déplacer vers un onglet</h3>
      <div class="form-row"><label>Onglet destination</label>
      <select id="mv-tab">${this.state.tabs.filter(t => t.id !== this.state.activeTab).map(t => `<option value="${t.id}">${this.escape(t.label)}</option>`).join('')}</select></div>
      <div class="modal-footer">
        <button class="btn-ghost" onclick="S.closeModal()">Annuler</button>
        <button class="btn-primary" onclick="S.doMoveWidget('${wid}','${colId}')">Déplacer</button>
      </div>`;
    document.getElementById('overlay').classList.add('on');
  },

  doMoveWidget(wid, colId) {
    const dest = document.getElementById('mv-tab').value;
    const srcCols = this.state.columns[this.state.activeTab] || [];
    const sc = srcCols.find(c => c.id === colId);
    if (sc) sc.widgets = sc.widgets.filter(w => w !== wid);
    const destCols = this.state.columns[dest] || [];
    if (!destCols.length) destCols.push({ id: mkId(), widgets: [] });
    destCols[0].widgets.push(wid);
    this.closeModal();
    this.render();
    this.saveState();
    this.toast('Widget déplacé');
  },

  removeWidget(wid, colId) {
    Object.values(this.state.columns).forEach(cols => cols.forEach(c => {
      c.widgets = c.widgets.filter(w => w !== wid);
    }));
    delete this.state.widgets[wid];
    this.closeCtx();
    this.render();
    this.saveState();
    this.toast('Widget supprimé');
  },

  renameTab(tid) {
    this.closeCtx();
    const tab = this.state.tabs.find(t => t.id === tid);
    if (!tab) return;
    document.getElementById('modal-body').innerHTML = `
      <h3>Renommer l'onglet</h3>
      <div class="form-row"><label>Nouveau nom</label><input id="rn-name" type="text" value="${this.escape(tab.label)}"></div>
      <div class="modal-footer">
        <button class="btn-ghost" onclick="S.closeModal()">Annuler</button>
        <button class="btn-primary" onclick="S.doRenameTab('${tid}')">OK</button>

    setTimeout(() => { const i = document.getElementById('rn-name'); if (i) i.select(); }, 50);

  doRenameTab(tid) {
    const tab = this.state.tabs.find(t => t.id === tid);
    if (tab) tab.label = document.getElementById('rn-name').value.trim() || tab.label;
    this.closeModal();
    this.render();
    this.saveState();
  },

  recolorTab(tid) {
    this.closeCtx();
    const tab = this.state.tabs.find(t => t.id === tid);
    if (!tab) return;
    const palette = ['#2563eb', '#059669', '#b45309', '#dc2626', '#7c3aed', '#0891b2', '#d97706', '#65a30d', '#db2777', '#4b5563'];
    document.getElementById('modal-body').innerHTML = `
      <h3>Couleur de l'onglet</h3>
      <div class="form-row"><label>Choisir une couleur</label>
        <input type="color" id="rc-color" value="${tab.color}">
      </div>
      <div class="form-row">
        <label>Suggestions</label>
        <div class="color-suggestions">
          ${palette.map(c => `<button type="button" class="color-swatch" style="background:${c}" onclick="document.getElementById('rc-color').value='${c}'"></button>`).join('')}
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-ghost" onclick="S.closeModal()">Annuler</button>
        <button class="btn-primary" onclick="S.doRecolorTab('${tid}')">OK</button>
      </div>`;
    document.getElementById('overlay').classList.add('on');
  },

  doRecolorTab(tid) {
    const tab = this.state.tabs.find(t => t.id === tid);
    if (tab) tab.color = document.getElementById('rc-color').value;
    this.closeModal();
    this.render();
    this.saveState();
  },

  duplicateTab(tid) {
    this.closeCtx();
    const tab = this.state.tabs.find(t => t.id === tid);
    if (!tab) return;
    const nid = mkId();
    this.state.tabs.push({ ...tab, id: nid, label: tab.label + ' (copie)', pinned: false });
    const srcCols = this.state.columns[tid] || [];
    const map = {};
    srcCols.forEach(c => c.widgets.forEach(wid => {
      const w = this.state.widgets[wid];
      if (w) { const nw = mkId(); this.state.widgets[nw] = { ...JSON.parse(JSON.stringify(w)), id: nw }; map[wid] = nw; }
    }));
    this.state.columns[nid] = srcCols.map(c => ({ id: mkId(), widgets: c.widgets.map(wid => map[wid]).filter(Boolean) }));
    this.state.layouts[nid] = this.state.layouts[tid] || '3';
    this.render();
    this.saveState();
    this.toast('Onglet dupliqué');
  },

  deleteTab(tid) {
    this.closeCtx();
    if (this.state.tabs.length <= 1) { this.toast('Impossible de supprimer le dernier onglet'); return; }
    if (!confirm('Supprimer cet onglet et tous ses widgets ?')) return;
    const cols = this.state.columns[tid] || [];
    cols.forEach(c => c.widgets.forEach(wid => delete this.state.widgets[wid]));
    this.state.tabs = this.state.tabs.filter(t => t.id !== tid);
    delete this.state.columns[tid];
    delete this.state.layouts[tid];
    if (this.state.activeTab === tid) this.state.activeTab = this.state.tabs[0].id;
    this.render();
    this.saveState();
    this.toast('Onglet supprimé');
  },

  doAddTab() {
    const label = document.getElementById('tab-name').value.trim() || 'Nouveau';

  // ===================================================================
  //  DASHBOARD (statistiques)
  // ===================================================================

  openDashboard() {
    const all = Object.values(this.state.widgets).flatMap(w => w.items || []);
    const unread = all.filter(i => i.unread).length;
    const alerts = all.filter(i => i.alert).length;
    const saved = this.state.saved.length;
    const later = this.state.later.length;
    const library = Object.keys(this.state.library || {}).length;

    const tabStats = this.state.tabs.map(t => {
      const cols = this.state.columns[t.id] || [];
      let widgets = 0, articles = 0, un = 0;
      cols.forEach(c => c.widgets.forEach(wid => {
        const w = this.state.widgets[wid];
        if (w) { widgets++; if (w.items) { articles += w.items.length; un += w.items.filter(i => i.unread).length; } }
      }));
      return { label: t.label, color: t.color, widgets, articles, unread: un };
    });

    const kwCounts = {};
    this.state.keywords.forEach(k => kwCounts[k] = 0);
    all.forEach(i => {
      const t = (i.title || '').toLowerCase();
      this.state.keywords.forEach(k => { if (t.includes(k.toLowerCase())) kwCounts[k]++; });
    });
    const topKw = Object.entries(kwCounts).sort((a, b) => b[1] - a[1]).slice(0, 5).filter(([, n]) => n > 0);

    const statCard = (num, lbl, color) => `
      <div style="background:var(--bg-subtle);padding:14px;border-radius:var(--radius-md)">
        <div style="font-size:22px;font-weight:700;color:${color || 'var(--text)'};letter-spacing:-0.02em">${num}</div>
        <div style="font-size:var(--font-2xs);color:var(--text-tertiary);font-weight:500;margin-top:2px;text-transform:uppercase;letter-spacing:0.05em">${lbl}</div>
      </div>`;

    document.getElementById('modal-body').innerHTML = `
      <h3>Tableau de bord</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        ${statCard(all.length, 'Articles')}
        ${statCard(unread, 'Non lus', 'var(--accent)')}
        ${statCard(alerts, 'Alertes', 'var(--danger)')}
        ${statCard(saved, 'Épinglés', 'var(--pinned)')}
        ${statCard(later, 'À lire plus tard', 'var(--warning)')}
        ${statCard(library, 'En bibliothèque', 'var(--success)')}
      </div>
      <div class="modal-section">
        <div class="modal-section-title">Par onglet</div>
        ${tabStats.map(s => `
          <div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:var(--font-sm)">
            <div style="width:8px;height:8px;border-radius:50%;background:${s.color}"></div>
            <div style="flex:1;font-weight:500">${this.escape(s.label)}</div>
            <div style="color:var(--text-tertiary);font-size:var(--font-xs)">${s.widgets} flux · ${s.articles} art.</div>
            <div style="min-width:36px;text-align:right;font-weight:600;color:${s.unread > 0 ? 'var(--accent)' : 'var(--text-tertiary)'}">${s.unread}</div>
          </div>`).join('')}
      </div>
      ${topKw.length ? `
      <div class="modal-section">
        <div class="modal-section-title">Mots-clés présents</div>
        ${topKw.map(([k, n]) => `
          <div style="display:flex;align-items:center;gap:8px;padding:5px 0;font-size:var(--font-sm)">
            <div style="flex:1">${this.escape(k)}</div>
            <div style="color:var(--text-tertiary)">${n} article(s)</div>
          </div>`).join('')}
      </div>` : ''}
      <div class="modal-footer"><button class="btn-primary" onclick="S.closeModal()">Fermer</button></div>`;
    document.getElementById('overlay').classList.add('on');
  },

  //  SETTINGS
  // ===================================================================

    const publicUrl = window.location.origin + window.location.pathname + '?view=public';

    const curDensity = localStorage.getItem(LS_DENSITY) || 'normal';

      <div class="segmented">

        </div>
        <div class="form-row"><label>Densité</label>
          ${seg('density', [['compact', 'Compact'], ['normal', 'Normal'], ['comfortable', 'Confortable']], curDensity, 'setDensity')}
        </div>
      </div>

      <div class="modal-section">
        <div class="modal-section-title">Backend & alertes</div>

      </div>

      <div class="modal-section">
        <div class="modal-section-title">Import / Export</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn-ghost" onclick="S.exportOPML()">Exporter OPML</button>
          <button class="btn-ghost" onclick="S.importOPMLPrompt()">Importer OPML</button>
          <button class="btn-ghost" onclick="S.exportJSON()">Export config</button>
        </div>
      </div>

      <div class="modal-section">
        <button class="btn-ghost btn-danger" onclick="S.resetAll()">Réinitialiser tout</button>
      </div>

      <div class="modal-footer">
        <button class="btn-ghost" onclick="S.closeModal()">Fermer</button>
        <button class="btn-primary" onclick="S.saveSettings()">Enregistrer</button>
      </div>`;
    document.getElementById('overlay').classList.add('on');
  },

  setTheme(v) {
    localStorage.setItem(LS_THEME, v);
    if (v === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', v);
    this.openSettings();
  },

  setDensity(v) {
    localStorage.setItem(LS_DENSITY, v);
    if (v === 'normal') document.documentElement.removeAttribute('data-density');
    else document.documentElement.setAttribute('data-density', v);
    this.openSettings();
  },

  saveSettings() {
    let url = document.getElementById('set-url').value.trim();
    if (url.endsWith('/')) url = url.slice(0, -1);
    if (url !== this.backendUrl) {
      if (url) localStorage.setItem(LS_BACKEND, url); else localStorage.removeItem(LS_BACKEND);
      this.backendUrl = url || null;
      this.checkBackend();
    }
    const kw = document.getElementById('set-kw').value.split('\n').map(s => s.trim()).filter(Boolean);
    this.state.keywords = kw;
    this.closeModal();
    this.saveState();
    this.render();
    this.toast('Paramètres enregistrés');
  },

  copyShareLink() {
    const url = document.getElementById('share-url').value;
    navigator.clipboard.writeText(url)
      .then(() => this.toast('Lien copié'))
      .catch(() => { document.getElementById('share-url').select(); document.execCommand('copy'); this.toast('Lien copié'); });
  },

  // ===================================================================
  //  OPML IMPORT / EXPORT
  // ===================================================================

  exportOPML() {
    const feeds = Object.values(this.state.widgets).filter(w => w.type === 'rss' && w.url);
    const opml = `<?xml version="1.0" encoding="UTF-8"?>
<opml version="2.0">
  <head><title>Veille Export</title><dateCreated>${new Date().toISOString()}</dateCreated></head>
  <body>
${feeds.map(w => `    <outline text="${this.escape(w.title)}" title="${this.escape(w.title)}" type="rss" xmlUrl="${this.escape(w.url)}"/>`).join('\n')}
  </body>
</opml>`;
    const b = new Blob([opml], { type: 'text/xml' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'veille-export.opml';
    a.click();
    this.toast('OPML téléchargé');
  },

  importOPMLPrompt() {
    this.closeModal();
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.opml,.xml,text/xml,text/x-opml';
    input.style.position = 'fixed';
    input.style.left = '-9999px';
    document.body.appendChild(input);
    input.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) { document.body.removeChild(input); return; }
      try {
        const text = await file.text();
        this.openOPMLImportChoice(text, file.name);
      } catch(err) {
        this.toast('Erreur de lecture');
      }
      document.body.removeChild(input);
    };
    input.click();
  },

  openOPMLImportChoice(xml, filename) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(xml, 'text/xml');
    if (doc.querySelector('parsererror')) { this.toast('OPML invalide'); return; }
    const allFlux = doc.querySelectorAll('outline[xmlUrl]');
    const categories = [];
    doc.querySelectorAll('body > outline').forEach(o => {
      if (!o.getAttribute('xmlUrl')) {
        const children = o.querySelectorAll(':scope > outline[xmlUrl], :scope outline[xmlUrl]');
        if (children.length > 0) categories.push({
          name: o.getAttribute('text') || o.getAttribute('title') || 'Sans nom',
          flux: Array.from(children)
        });
      }
    });
    if (allFlux.length === 0) { this.toast('Aucun flux trouvé'); return; }
    if (categories.length === 0) { this.importOPMLFlat(allFlux); return; }

    document.getElementById('modal-body').innerHTML = `
      <h3>Import OPML</h3>
      <p style="font-size:var(--font-sm);color:var(--text-secondary);margin-bottom:12px">${this.escape(filename)} — <strong>${allFlux.length} flux</strong> dans <strong>${categories.length} catégorie(s)</strong>.</p>
      <div style="background:var(--bg-subtle);padding:12px;border-radius:var(--radius-md);cursor:pointer;transition:background 120ms" onclick="S.doImportOPMLHierarchical()" onmouseover="this.style.background='var(--bg-hover)'" onmouseout="this.style.background='var(--bg-subtle)'">
        <div style="font-weight:600">📁 Import hiérarchique (recommandé)</div>
        <div style="font-size:var(--font-xs);color:var(--text-secondary);margin-top:4px">Chaque catégorie devient un nouvel onglet — ${categories.length} onglets créés.</div>
      </div>
      <div style="background:var(--bg-subtle);padding:12px;border-radius:var(--radius-md);cursor:pointer;margin-top:8px;transition:background 120ms" onclick="S.doImportOPMLFlat()" onmouseover="this.style.background='var(--bg-hover)'" onmouseout="this.style.background='var(--bg-subtle)'">
        <div style="font-weight:600">📄 Import plat</div>
        <div style="font-size:var(--font-xs);color:var(--text-secondary);margin-top:4px">Tous les ${allFlux.length} flux dans l'onglet actif.</div>
      </div>
      <div class="modal-footer"><button class="btn-ghost" onclick="S.closeModal()">Annuler</button></div>`;
    this._opmlCategories = categories;
    this._opmlAllFlux = allFlux;
    document.getElementById('overlay').classList.add('on');
  },

  doImportOPMLHierarchical() {
    const cats = this._opmlCategories;
    if (!cats) return;
    const palette = ['#2563eb', '#059669', '#b45309', '#dc2626', '#7c3aed', '#0891b2', '#d97706', '#65a30d', '#db2777', '#4b5563'];
    let total = 0;
    cats.forEach((cat, ci) => {
      const tid = mkId();
      this.state.tabs.push({
        id: tid,
        label: cat.name.length > 40 ? cat.name.slice(0, 40) + '…' : cat.name,
        color: palette[ci % palette.length]
      });
      this.state.layouts[tid] = cat.flux.length <= 2 ? '2' : cat.flux.length <= 6 ? '3' : '4';
      const numCols = parseInt(this.state.layouts[tid]);
      const cols = [];
      for (let i = 0; i < numCols; i++) cols.push({ id: mkId(), widgets: [] });
      this.state.columns[tid] = cols;
      cat.flux.forEach((o, fi) => {
        const url = o.getAttribute('xmlUrl');
        const title = o.getAttribute('title') || o.getAttribute('text') || url;
        if (!url) return;
        const id = mkId();
        this.state.widgets[id] = { id, type: 'rss', title, source: 'rss', collapsed: false, url, items: [] };
        cols[fi % numCols].widgets.push(id);
        total++;
        this.fetchFeed(id);
      });
    });
    this._opmlCategories = this._opmlAllFlux = null;
    this.closeModal();
    this.saveState();
    this.render();
    this.toast(`${cats.length} onglet(s), ${total} flux importés`);
  },

  doImportOPMLFlat() {
    const flux = this._opmlAllFlux;
    if (flux) this.importOPMLFlat(flux);
    this._opmlCategories = this._opmlAllFlux = null;
    this.closeModal();
  },

  importOPMLFlat(outlines) {
    const cols = this.state.columns[this.state.activeTab] || [];
    if (!cols.length) { cols.push({ id: mkId(), widgets: [] }); this.state.columns[this.state.activeTab] = cols; }
    let n = 0;
    outlines.forEach((o, i) => {
      const url = o.getAttribute('xmlUrl');
      const title = o.getAttribute('title') || o.getAttribute('text') || url;
      if (!url) return;
      const id = mkId();
      this.state.widgets[id] = { id, type: 'rss', title, source: 'rss', collapsed: false, url, items: [] };
      const col = cols[i % cols.length];
      col.widgets.push(id);
      n++;
      this.fetchFeed(id);
    });
    this.saveState();
    this.render();
    this.toast(n + ' flux importés');
  },

  exportJSON() {
    const b = new Blob([JSON.stringify(this.state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'veille-config.json';
    a.click();
    this.toast('Config exportée');
  },

  resetAll() {
    if (!confirm('Effacer toute la configuration locale ?')) return;
    localStorage.removeItem(LS_STATE);
    location.reload();
  },

  // ===================================================================
  //  UTILS
  // ===================================================================

  closeModal() { document.getElementById('overlay').classList.remove('on'); },

  toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(this.toastTimer);
    this.toastTimer = setTimeout(() => t.classList.remove('on'), 2500);
  },

  escape(s) {
    if (s === undefined || s === null) return '';
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  }
};

// =====================================================================
//  GLOBAL EVENT LISTENERS
// =====================================================================

document.addEventListener('click', e => {
  const ctx = document.getElementById('ctx-menu');
  if (ctx && !ctx.contains(e.target)) ctx.style.display = 'none';
});
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target.id === 'overlay') S.closeModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    S.closeModal();
    S.closeReader();
    S.closeLibrary();
    S.closeCtx();
  }
});

S.init();
</script>
</body>
</html>
